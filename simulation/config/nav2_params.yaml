# Nav2 parameters for EdgeFleet AMR
# Each robot uses its own namespace (e.g., /amr01/nav2_params)

amr01:
  ros__parameters:
    # --- Robot Model ---
    robot_model_id: "amr"
    use_sim_time: true

    # --- Controller Server ---
    controller_server:
      ros__parameters:
        controller_frequency: 20.0
        min_x_velocity_threshold: 0.001
        min_y_velocity_threshold: 0.5
        min_theta_velocity_threshold: 0.001
        progress_checker_plugins: ["progress_checker"]
        goal_checker_plugins: ["general_goal_checker"]
        controller_plugins: ["FollowPath"]

        progress_checker:
          plugin: "nav2_controller::SimpleProgressChecker"
          required_movement_radius: 0.5
          movement_time_allowance: 10.0

        general_goal_checker:
          plugin: "nav2_controller::SimpleGoalChecker"
          stateful: true
          plugin: "nav2_controller::SimpleGoalChecker"

        FollowPath:
          plugin: "dwb_core::DWBLocalPlanner"
          max_vel_x: 0.5
          min_vel_x: 0.0
          max_vel_y: 0.0
          min_vel_y: 0.0
          max_vel_theta: 1.0
          min_speed_xy: 0.0
          max_speed_xy: 0.5
          max_vel_theta: 1.0
          min_speed_xy: 0.0
          max_speed_xy: 0.5
          acc_lim_x: 2.5
          acc_lim_y: 0.0
          acc_lim_theta: 3.2
          decel_lim_x: -2.5
          decel_lim_y: 0.0
          decel_lim_theta: -3.2
          vx_samples: 20
          vy_samples: 0
          vtheta_samples: 20
          sim_time: 2.0
          linear_granularity: 0.05
          angular_granularity: 0.025
          transform_tolerance: 0.2
          xy_goal_tolerance: 0.2
          stateful: true

    # --- Local Costmap ---
    local_costmap:
      ros__parameters:
        update_frequency: 5.0
        publish_frequency: 2.0
        global_frame: odom
        robot_base_frame: base_link
        use_sim_time: true
        rolling_window: true
        width: 3
        height: 3
        resolution: 0.05
        robot_radius: 0.25
        plugins: ["voxel_layer", "inflation_layer"]
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          inflation_radius: 0.55
          cost_scaling_factor: 3.0
        voxel_layer:
          plugin: "nav2_costmap_2d::VoxelLayer"
          enabled: true
          publish_voxel_map: true
          origin_z: 0.0
          z_resolution: 0.05
          z_voxels: 16
          max_obstacle_height: 2.0
          marking: true
          clearing: true

    # --- Global Costmap ---
    global_costmap:
      ros__parameters:
        update_frequency: 1.0
        publish_frequency: 1.0
        global_frame: map
        robot_base_frame: base_link
        use_sim_time: true
        robot_radius: 0.25
        resolution: 0.05
        track_unknown_space: true
        plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          scan:
            topic: /scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          inflation_radius: 0.55
          cost_scaling_factor: 3.0

    # --- Planner Server ---
    planner_server:
      ros__parameters:
        expected_planner_frequency: 20.0
        plugin: "nav2_planner::PlannerServer"
        planner_plugins: ["GridBased"]
        GridBased:
          plugin: "nav2_navfn_planner::NavfnPlanner"
          tolerance: 2.0
          use_astar: true
          allow_unknown: true

    # --- Behavior Server ---
    behavior_server:
      ros__parameters:
        costmap_topic: local_costmap/costmap_raw
        footprint_topic: local_costmap/published_footprint
        cycle_frequency: 10.0
        behavior_plugins: ["spin", "back_up", "drive_on_heading", "wait", "assisted_teleop"]
        spin:
          plugin: "nav2_behaviors::Spin"
        back_up:
          plugin: "nav2_behaviors::BackUp"
        drive_on_heading:
          plugin: "nav2_behaviors::DriveOnHeading"
        wait:
          plugin: "nav2_behaviors::Wait"
        assisted_teleop:
          plugin: "nav2_behaviors::AssistedTeleop"

    # --- BT Navigator ---
    bt_navigator:
      ros__parameters:
        bt_loop_duration: 100
        default_server_timeout: 20
        wait_for_service_timeout: 1000
        action_server_result_timeout: 900.0
        navj: "nav2_bt_navigator::NavigatorServer"
        navigator_plugins: ["navigate_to_pose"]
        navigate_to_pose:
          plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
